trigger:
  - dev
  - main

pool:
  vmImage: 'ubuntu-latest'

steps:
- task: JavaToolInstaller@0
  inputs:
    versionSpec: '17'
    jdkArchitectureOption: 'x64'
    jdkSourceOption: 'PreInstalled'
  displayName: '1. Setup Java 17'

- script: |
    echo "##[section] 📂 Step 2.1: Clean and Install"
    mvn clean install -DskipTests

    echo "##[section] 📂 Step 2.2: Force Browser & Linux Library Install"
    # This is the most important line for Ubuntu agents
    mvn exec:java -e -Dexec.mainClass="com.microsoft.playwright.CLI" -Dexec.args="install --with-deps"

    echo "##[section] 📂 Step 2.3: Run Tests with CI stability flags"
    # -Dsurefire.forkCount=0 prevents the "Corrupted Channel" error
    # -Dheadless=true ensures it runs in the background
    mvn test -Dheadless=true -Dsurefire.forkCount=0
  displayName: '2. Build and Execute Playwright'

- task: PublishTestResults@2
  inputs:
    testResultsFormat: 'JUnit'
    testResultsFiles: '**/target/surefire-reports/TEST-*.xml'
    mergeTestResults: true
    failTaskOnFailedTests: true
  condition: always()
  displayName: '3. Publish Test Report'