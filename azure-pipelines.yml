trigger:
  branches:
    include:
      - '*'   # Run on all branches

pr:
  branches:
    include:
      - '*'   # Run on all PRs

pool:
  vmImage: 'ubuntu-latest'

jobs:
- job: BuildAndTest
  displayName: 'Build and Test Java Project'
  steps:
  - checkout: self
    displayName: 'Checkout repository'

  - task: JavaToolInstaller@0
    inputs:
      versionSpec: '17'
      jdkArchitectureOption: 'x64'
      jdkSourceOption: 'PreInstalled'
    displayName: 'Set up JDK 17'

  - script: mvn clean install -DskipTests
    displayName: 'Install dependencies'

  - script: mvn compile
    displayName: 'Build project'

  # --- ADDED STEP: Install Playwright Browsers ---
  - script: mvn exec:java -e -D exec.mainClass=com.microsoft.playwright.CLI -D exec.args="install --with-deps"
    displayName: 'Install Playwright Browsers'

  # --- UPDATED STEP: Run tests with Virtual Display ---
  - script: |
      export DISPLAY=:99
      Xvfb :99 -screen 0 1024x768x24 &
      mvn test
    displayName: 'Run automated tests'

  # --- ADDED STEP: Publish results even if tests fail ---
  - task: PublishTestResults@2
    condition: succeededOrFailed()
    inputs:
      testResultsFormat: 'JUnit'
      testResultsFiles: '**/surefire-reports/TEST-*.xml'
    displayName: 'Publish Test Results'