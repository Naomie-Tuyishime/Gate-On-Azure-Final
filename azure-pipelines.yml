trigger:
  - dev
  - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  # This ensures Playwright knows where to look for browsers on the agent
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '0'

steps:
# Step 1: Install Java 17
- task: JavaToolInstaller@0
  inputs:
    versionSpec: '17'
    jdkArchitectureOption: 'x64'
    jdkSourceOption: 'PreInstalled'
  displayName: '1. Setup Java 17'

# Step 2: Build, Install Browsers, and Run Tests
- script: |
    echo "##[section] 📂 Step 2.1: Installing Maven Dependencies..."
    mvn install -DskipTests

    echo "##[section] 📂 Step 2.2: Installing Playwright & System Dependencies..."
    # This command downloads the browsers AND the Linux libraries (libgbm, etc.)
    mvn exec:java -e -Dexec.mainClass="com.microsoft.playwright.CLI" -Dexec.args="install --with-deps"

    echo "##[section] 📂 Step 2.3: Running Automation Tests..."
    # We use -Dheadless=true just in case your Java code doesn't force it
    mvn test -Dheadless=true
  displayName: '2. Build and Execute Playwright'

# Step 3: Publish Results to the "Tests" Tab
- task: PublishTestResults@2
  inputs:
    testResultsFormat: 'JUnit'
    testResultsFiles: '**/target/surefire-reports/TEST-*.xml'
    mergeTestResults: true
    failTaskOnFailedTests: true
  condition: always()
  displayName: '3. Publish Test Report'