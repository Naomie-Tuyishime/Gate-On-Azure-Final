trigger:
  - '*'

pool:
  vmImage: 'ubuntu-latest'

steps:
- checkout: self

- task: JavaToolInstaller@0
  inputs:
    versionSpec: '17'
    jdkArchitectureOption: 'x64'
    jdkSourceOption: 'PreInstalled'

- script: mvn clean install -DskipTests
  displayName: 'Install Maven Dependencies'

# THE FIX: We use the Playwright CLI to install the OS-level dependencies
- script: |
    mvn exec:java -e -D exec.mainClass=com.microsoft.playwright.CLI -D exec.args="install-deps"
    mvn exec:java -e -D exec.mainClass=com.microsoft.playwright.CLI -D exec.args="install"
  displayName: 'Fix Linux System Dependencies'

# RUN TESTS: We wrap it in xvfb-run to provide a virtual GUI environment
- script: |
    xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" mvn test -Dheadless=true
  displayName: 'Run automated tests'

- task: PublishTestResults@2
  condition: succeededOrFailed()
  inputs:
    testResultsFormat: 'JUnit'
    testResultsFiles: '**/surefire-reports/TEST-*.xml'