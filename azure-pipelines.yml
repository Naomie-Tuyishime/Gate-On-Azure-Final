trigger:
  - dev
  - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  # This fixes the "Corrupted Channel" by preventing Surefire from miscommunicating with the JVM
  MAVEN_OPTS: '-Dfile.encoding=UTF-8'

steps:
- task: JavaToolInstaller@0
  inputs:
    versionSpec: '17'
    jdkArchitectureOption: 'x64'
    jdkSourceOption: 'PreInstalled'
  displayName: '1. Setup Java 17'

- script: |
    echo "##[command] Installing Maven Dependencies..."
    mvn install -DskipTests

    echo "##[command] Installing Playwright Browsers & Linux Deps..."
    # This installs the actual browser binaries AND the Linux system libraries
    mvn exec:java -e -Dexec.mainClass="com.microsoft.playwright.CLI" -Dexec.args="install --with-deps"

    echo "##[command] Running Tests in Headless Mode..."
    # 'forkCount=0' often fixes the "Corrupted Channel" error in CI environments
    mvn test -Dheadless=true -Dsurefire.forkCount=0
  displayName: '2. Build and Run Playwright'

- task: PublishTestResults@2
  inputs:
    testResultsFormat: 'JUnit'
    testResultsFiles: '**/target/surefire-reports/TEST-*.xml'
    mergeTestResults: true
    failTaskOnFailedTests: true
  condition: always()
  displayName: '3. Publish Test Report'